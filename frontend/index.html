<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before first paint so there's no light flash. -->
    <script>
      try {
        var t = localStorage.getItem('ledger-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EEE5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)" />
    <meta name="ledger:letter" content="R" />
    <meta name="ledger:product" content="Recruitment Suite" />
    <meta
      name="description"
      content="Agentic candidate evaluation. A CV and a job description go in; a scored, traceable hiring recommendation comes out."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Recruitment Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
