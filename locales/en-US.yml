  onboarding: "Week 1-2: Orientation & company culture\nWeek 2-4: Technical deep-dive & skill assessment\nWeek 4-6: First project (paired with mentor)\nWeek 6+: Full autonomy & ramp-up"

  report:
    title: "Candidate Evaluation Report"
    candidate: "Candidate"
    job: "Job"
    at: "at"
    final_score: "Final Score"
    score_after_notes: "Score after interview notes"
    recommendation: "Recommendation"
    confidence: "Confidence"
    generated: "Generated"
    score_breakdown: "Score Breakdown"
    score_breakdown_tip: "Each score (0-100) is produced by a dedicated agent, then combined with fixed weights into the Final Score. Click a row below to see exactly why it scored the way it did."
    profile_tip: "Experience level, education/domain background, career trajectory and language fit against the role's stated requirements."
    technical_tip: "Match between the candidate's hard skills / technology stack and the job's required and nice-to-have skills."
    culture_fit_tip: "Alignment with team dynamics, communication style, and company values inferred from the candidate's profile and CV."
    references_tip: "Strength and verification status of professional references and past-performance signals."
    people_analytics_tip: "Specialized expertise in HR analytics, people data and organizational-insight tooling. Replaces Technical for HR/People roles."
    strategic_bonus: "Strategic Bonus"
    strategic_bonus_tip: "Extra points (up to +5) awarded for hiring urgency and market scarcity of this skill set. Added on top of the weighted score."
    why_score: "Why %{score}/100?"
    dimension_col: "Dimension"
    score_col: "Score"
    weight_col: "Weight"
    notes_col: "Notes"
    key_strengths: "Key Strengths"
    key_strengths_tip: "Dimensions where the candidate scored 80/100 or higher — clear competitive advantages for this role."
    addressable_gaps: "Addressable Gaps"
    addressable_gaps_tip: "Dimensions scoring 60-74/100 — learnable gaps, not blockers, worth covering in an onboarding or development plan."
    critical_flags: "Critical Flags"
    critical_flags_tip: "A dimension scored below 50/100, or there's a >30-point gap between Technical and Culture Fit — review before proceeding."
    next_steps: "Next Steps"
    next_steps_tip: "Actions are chosen automatically from the final recommendation: GO → offer & onboarding, HOLD → gather more data, NO_GO → respectful rejection."
    onboarding_plan: "Onboarding Plan"
    onboarding_plan_tip: "A suggested 6+ week ramp-up plan, generated only when the recommendation is GO."
    none_identified: "None identified"
    status_go: "GO"
    status_hold: "HOLD"
    status_no_go: "NO GO"
    interview_notes: "Post-Interview Notes"
    interview_notes_tip: "Recruiter notes added after the interview, fed back into the agents to recalculate the scores above."
    score_before_notes: "Score before interview notes"
    export_pdf: "Print / Save as PDF"

  interview:
    title: "Interview Guide"
    tip: "Questions chosen from this candidate's gaps. Bring the answers back as post-interview notes and every score recalculates against them."
    focus_col: "Focus"
    question_col: "Ask"
    listen_col: "Listen for"
    dimension_col: "Probes"
    none: "Nothing scored weakly enough to need a targeted probe."

    focus_experience: "Depth of experience"
    focus_collaboration: "Collaboration and leadership"
    focus_verifiability: "Verifiability"
    focus_corroboration: "Corroboration"

    q_missing_skill: "The record shows no evidence of %{skills}. Ask for the last thing they built or ran with it, and what broke."
    listen_missing_skill: "A specific project, the part they personally owned, and a concrete failure they diagnosed — not a list of tools."

    q_missing_signal: "No signal for %{signals} anywhere in the record. Ask for a concrete example from the last two years."
    listen_missing_signal: "A named programme or dataset, their role in it, and what changed as a result."

    q_profile: "Experience scored %{score}/100 against a requirement of %{years} years. Ask them to walk through the two roles closest to this one and what they personally owned."
    listen_profile: "Scope they owned rather than the team's, and decisions they made without cover."

    q_culture: "Culture signals scored %{score}/100 — the record is thin on collaboration and leadership. Ask about the last time they changed a team's mind, and how."
    listen_culture: "A named disagreement, the other side stated fairly, and what holding the position cost them."

    q_references: "Verifiability scored %{score}/100: little on the record can be checked independently. Ask who could speak to the project they lead with, and in what capacity."
    listen_references: "Named people with a real reporting relationship, and a willingness to have them contacted."

    q_corroboration: "Take the strongest claim on the CV and ask them to reconstruct it end to end: the problem, the decisions they made, the numbers, and what they would do differently."
    listen_corroboration: "Detail that could not have been rehearsed — constraints, tradeoffs, and a mistake they own."
    q_missing_skills: "The record shows no evidence of %{skills}. Ask them to pick the one they know best, describe the last thing they built or ran with it, and say what broke."
    q_missing_signals: "No signal for %{signals} anywhere in the record. Ask them to pick one and give a concrete example from the last two years."
    list_and: "and"
