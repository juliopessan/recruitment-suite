    score_breakdown: "Detalhamento das Notas"
    score_breakdown_tip: "Cada nota (0-100) é produzida por um agente dedicado e combinada com pesos fixos na Nota Final. Clique em uma linha abaixo para ver exatamente por que ela recebeu essa nota."
    profile_tip: "Nível de experiência, formação/domínio, trajetória de carreira e fit de idiomas em relação aos requisitos da vaga."
    technical_tip: "Compatibilidade entre as habilidades técnicas / stack do candidato e as habilidades obrigatórias e desejáveis da vaga."
    culture_fit_tip: "Alinhamento com a dinâmica do time, estilo de comunicação e valores da empresa, inferido a partir do perfil e CV do candidato."
    references_tip: "Força e status de verificação das referências profissionais e sinais de desempenho anterior."
    people_analytics_tip: "Expertise especializada em People Analytics, dados de pessoas e ferramentas de insight organizacional. Substitui o Técnico para vagas de RH/People."
    strategic_bonus: "Bônus Estratégico"
    strategic_bonus_tip: "Pontos extras (até +5) concedidos por urgência de contratação e escassez de mercado para esse perfil. Somado ao final da nota ponderada."
    why_score: "Por que %{score}/100?"
    dimension_col: "Dimensão"
    score_col: "Nota"
    weight_col: "Peso"
    notes_col: "Notas"
    key_strengths: "Principais Pontos Fortes"
    key_strengths_tip: "Dimensões em que o candidato obteve nota igual ou superior a 80/100 — vantagens competitivas claras para a vaga."
    addressable_gaps: "Lacunas Desenvolvíveis"
    addressable_gaps_tip: "Dimensões com nota entre 60-74/100 — lacunas desenvolvíveis, não bloqueadoras, que valem um plano de desenvolvimento ou onboarding."
    critical_flags: "Alertas Críticos"
    critical_flags_tip: "Uma dimensão com nota abaixo de 50/100, ou uma diferença maior que 30 pontos entre Técnico e Fit Cultural — revisar antes de prosseguir."
    next_steps: "Próximos Passos"
    next_steps_tip: "As ações são escolhidas automaticamente a partir da recomendação final: GO → proposta e onboarding, HOLD → coletar mais dados, NO_GO → recusa respeitosa."
    onboarding_plan: "Plano de Onboarding"
    onboarding_plan_tip: "Um plano sugerido de 6+ semanas de ramp-up, gerado apenas quando a recomendação é GO."
    none_identified: "Nenhum identificado"
    status_go: "CONTRATAR"
    status_hold: "EM ESPERA"
    status_no_go: "NÃO CONTRATAR"
    interview_notes: "Notas Pós-Entrevista"
    interview_notes_tip: "Notas do recrutador adicionadas após a entrevista, realimentadas nos agentes para recalcular as notas acima."
    score_before_notes: "Nota antes das notas da entrevista"
    export_pdf: "Imprimir / Salvar como PDF"

  interview:
    title: "Roteiro de Entrevista"
    tip: "Cinco perguntas — técnicas e comportamentais — construídas a partir da vaga e do perfil deste candidato. Faça delas uma conversa de verdade, não um checklist: siga a história para onde ela for."
    kind_technical: "Técnico"
    kind_behavioral: "Comportamental"
    listen_col: "Escute por"
    focus_team_fit: "Adaptação ao time"
    focus_influence: "Influência sem autoridade"
    focus_achievement: "Conquista de destaque"
    focus_ownership: "Responsabilidade sob pressão"
    focus_judgment: "Julgamento técnico"
    q_tech_generic: "Peça que descreva a abordagem padrão dela para depurar algo que nunca viu falhar antes — as três primeiras coisas que checaria, em ordem."
    listen_tech_generic: "Um método estruturado, não uma história de tentativa e erro — e evidência de que já precisou disso antes de verdade."
    q_behavioral_ownership: "Peça uma história da última vez em que algo sob sua responsabilidade deu errado — a situação, a tarefa, o que ela realmente fez a respeito, e o resultado."
    listen_behavioral_ownership: "Se ela assume o erro diretamente, uma ação concreta de recuperação, e o que mudou depois — não só 'aprendemos muito'."
    dimension_col: "Tipo"
    list_and: "e"

    # --- Técnica, posição 1: a competência central da vaga, lacuna ou força
    q_tech_gap_one: "Não há evidência de %{skill} no material. Conduza por um cenário real: o último sistema em que ela mexeu que fosse próximo disso, o que buscaria primeiro, e onde esperaria travar."
    q_tech_gap_many: "Não há evidência de %{skills} no material. Peça que escolha a mais próxima de algo que já fez de verdade, e conduza do início ao fim — o desenho, os trade-offs, o que quebrou."
    listen_tech_gap: "Raciocínio real transferindo de uma ferramenta próxima, não definição decorada — e honestidade sobre onde o conhecimento realmente para."
    q_tech_strength: "O material mostra profundidade real em %{skill}. Peça que leve você para dentro da coisa mais complexa que construiu com isso — as restrições, as decisões que ninguém mais concordava, e o que reconstruiria diferente hoje."
    listen_tech_strength: "Um sistema específico, uma decisão que era dela e que defenderia, e um genuíno 'hoje eu faria diferente' — não um discurso de vitrine."

    # --- Técnica, posição 2: ancorada nas próprias palavras da vaga -------
    q_scenario: "A responsabilidade central desta vaga é: \"%{responsibility}\". Peça que descreva, passo a passo, como abordaria isso nos primeiros 90 dias — ancorado em algo parecido que já fez de verdade."
    listen_scenario: "Um primeiro movimento concreto, não um recital de framework — e um exemplo passado que realmente se pareça com essa responsabilidade."
    q_nice_to_have: "A vaga lista %{skill} como diferencial. Pergunte como pegaria isso rápido se ainda não tem, ou onde já usou de fato se tem."
    listen_nice_to_have: "Curiosidade genuína ou histórico de mão na massa genuíno — os dois servem, uma resposta vaga não."
    q_seniority_scenario: "Para um(a) %{title} nível %{seniority}, peça que descreva em voz alta como abordaria a primeira grande decisão técnica desta vaga."
    listen_seniority_scenario: "Raciocínio estruturado sob ambiguidade, e as perguntas que faria antes de se comprometer com uma abordagem."

    # --- Comportamental (STAR), posição 3: o contexto de time da vaga ----
    q_behavioral_team_context: "A vaga descreve este contexto de time: \"%{team_context}\". Peça uma história de uma vez em que teve que adaptar seu jeito de trabalhar para caber em um time assim — a situação, o que se esperava dela, o que ela realmente fez, e como isso repercutiu."
    q_behavioral_general: "Peça uma história da última vez em que precisou influenciar uma decisão sem ter autoridade para tomá-la — a situação, o que estava em jogo, o que ela fez, e o que aconteceu."
    listen_behavioral_general: "Uma divergência real, o outro lado representado com justiça, uma ação concreta — não uma declaração de valores — e um resultado honesto, vitória ou não."

    # --- Comportamental (STAR), posição 4: um tema nomeado, lacuna ou força
    q_behavioral_theme_gap: "Nada no material sinaliza %{theme}. Peça uma história sobre isso mesmo assim — a situação, a tarefa, a ação que tomou, e o resultado — mesmo que pequeno."
    listen_behavioral_theme_gap: "Se existe mesmo um exemplo real, e se existe, se a ação descrita era realmente dela."
    q_behavioral_theme_strength: "O material sinaliza %{theme}. Peça a história por trás disso: a situação, o que precisava acontecer, o que ela realmente fez, e aonde isso levou."
    listen_behavioral_theme_strength: "Especificidade — nomes, números, uma decisão que era genuinamente dela de tomar."

    # --- Encerramento, posição 5: reconstruir a alegação mais forte, como história
    q_closing_claim: "Peça que reconstrua %{claim} do início ao fim, como uma história: a situação, a tarefa, exatamente o que fez, e o resultado — números incluídos, e o que mudaria agora."
    q_closing_generic: "Peça que conduza pela conquista de que mais se orgulha, como uma história completa: a situação, a tarefa, exatamente o que fez, e o resultado."
    listen_closing: "Detalhe que não daria para ensaiar — uma restrição real, um trade-off real, um erro que ela assume."
    list_and: "e"
